# Ground truth metadata for NREL/LBNL WISE-CASING TDR experimental dataset
# Source: Geothermal Data Repository (GDR) Submission 1164 / OSTI ID 1559012
# Dataset Title: "WISE-CASING: Time Domain Reflectometry Data from Lab Experiment on Coaxial Cable"
# Authors: Wu, Yuxin; Wang, Jiannan (Lawrence Berkeley National Laboratory)
# Permanent DOI: 10.15121/1559012

dataset: WISE-CASING
organization: Lawrence Berkeley National Laboratory (LBNL)
authors: "Wu, Yuxin; Wang, Jiannan"
doi: "10.15121/1559012"
cable_type: "RG-85 coaxial cable"
cable_type_source:
  file: "GDR Submission 1164 Overview / Abstract"
  quote: "This dataset features laboratory Time Domain Reflectometry (TDR) measurements using an 80-meter RG-85 coaxial cable to evaluate wellbore/casing integrity sensing."

nominal_velocity_factor: "unknown"
nominal_velocity_factor_source:
  file: "GDR Submission 1164 Documentation"
  quote: "Not explicitly documented in numerical form; nominal velocity factor for solid polyethylene RG-85 dielectric is assumed ~0.66 for time-grid alignment."

voltage_units: "mV"
voltage_units_source:
  file: "TDR_20180315194711u.csv header"
  quote: "Time(us),Amplitude(mV)"

time_units: "us"
time_units_source:
  file: "TDR_20180315194711u.csv header"
  quote: "Time(us),Amplitude(mV)"

traces:
